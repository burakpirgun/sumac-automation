name: Validate Sumac real domain
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/website-live-check.mjs', '.github/workflows/validate-sumac-web.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node scripts/website-live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sumac-real-domain-validation
          path: website-validation/
          retention-days: 14
